<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Trắc nghiệm trực tiếp</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1>Trắc nghiệm hiển thị đáp án ngay</h1>
    
    <!-- Nút tráo câu hỏi -->
    <button type="button" id="shuffleBtn">🔀 Tráo câu hỏi</button>

    <form id="quizForm"></form>
  </div>

  <script src="script.js"></script>
  <script>
// Chặn chuột phải
document.addEventListener("contextmenu", function(e) {
  e.preventDefault();
});

// Chặn phím F12, Ctrl+Shift+I, Ctrl+U
document.addEventListener("keydown", function(e) {
  // F12
  if (e.key === "F12") {
    e.preventDefault();
  }
  // Ctrl+Shift+I
  if (e.ctrlKey && e.shiftKey && e.key === "I") {
    e.preventDefault();
  }
  // Ctrl+U (xem source)
  if (e.ctrlKey && e.key === "u") {
    e.preventDefault();
  }
});
</script>
</body>
</html>
